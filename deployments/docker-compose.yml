services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: omnihive-broker
    ports:
      - "1883:1883"
    volumes:
      - ../configs/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:18.4
    container_name: omnihive-db
    environment:
      POSTGRES_USER: omnihive
      POSTGRES_PASSWORD: omnihive_password
      POSTGRES_DB: omnihive_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnihive -d omnihive_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  master:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.master
    container_name: omnihive-master
    ports:
      - "8080:8080"
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - GIN_MODE=release

  simulator:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.simulator
    container_name: omnihive-simulator
    depends_on:
      mosquitto:
        condition: service_healthy
      master:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.web
    container_name: omnihive-web
    ports:
      - "3000:80"
    depends_on:
      - master

volumes:
  pgdata:
