services:
  # 1. MQTT Message Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: omnihive-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # 2. OmniHive Backend (Fleet Manager & REST/WebSocket Gateway)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnihive-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MQTT_BROKER=tcp://mosquitto:1883
      - AGV_ID=AGV-001
      - LAYOUT_FILE=/app/factory_layout.json
    volumes:
      - ./backend/factory_layout.json:/app/factory_layout.json
    depends_on:
      - mosquitto

  # 3. 支援 VDA 5050 的車輛行為模擬器 (Kinematics, Battery CC/CV, Actions)
  vehicle-sim:
    build:
      context: ./backend
      dockerfile: Dockerfile.simulator
    container_name: omnihive-vehicle-sim
    restart: unless-stopped
    environment:
      - MQTT_BROKER=tcp://mosquitto:1883
      - AGV_ID=AGV-001
      - LAYOUT_FILE=/app/factory_layout.json
    volumes:
      - ./backend/factory_layout.json:/app/factory_layout.json
    depends_on:
      - mosquitto
      - backend

  # 4. Frontend Web UI (Vue 3 + Babylon.js 3D Smart Factory)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnihive-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
